<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#bgGradient)" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- T letter -->
  <path d="M25 25 L75 25 M50 25 L50 70" stroke="url(#textGradient)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- P letter -->
  <path d="M30 30 L30 65 M30 30 Q50 30 50 45 Q50 60 30 60" stroke="url(#textGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Small decorative elements -->
  <circle cx="75" cy="25" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="25" cy="75" r="2" fill="#FFFFFF" opacity="0.6"/>
</svg> 